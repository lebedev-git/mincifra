<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Платформа реестра российского ПО</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">Р</div>
      <div>
        <h1>Реестр российского ПО — платформа подготовки</h1>
        <div class="sub">подготовка и самопроверка перед подачей в Минцифры</div>
      </div>
    </div>
    <nav id="topnav">
      <a href="#/">Продукты</a>
      <a href="#/profile">Профиль</a>
      <a href="#/glossary">Словарь</a>
      <a href="#/normative">Нормативка</a>
      <a href="#/sources">Источники</a>
      <a href="#/about">О платформе</a>
    </nav>
  </header>
  <script>
    // Подсветка активной вкладки по текущему hash (routing — на хэшах, см. app.js).
    (function () {
      var nav = document.getElementById("topnav");
      function mark() {
        var h = location.hash || "#/";
        var base = "#/" + (h.replace(/^#\/?/, "").split("/")[0] || "");
        nav.querySelectorAll("a").forEach(function (a) {
          a.classList.toggle("active", a.getAttribute("href") === base);
        });
      }
      addEventListener("hashchange", mark); mark();
    })();
  </script>

  <main class="container" id="app">
    <!-- рендерится app.js -->
  </main>

  <div class="toast" id="toast"></div>

  <script src="/ui.js"></script>
  <script src="/app.js"></script>
</body>
</html>
